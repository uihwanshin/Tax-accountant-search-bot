<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세무사 매칭 검색</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0F6E56;
    --primary-light: #E1F5EE;
    --primary-mid: #9FE1CB;
    --accent: #185FA5;
    --accent-light: #E6F1FB;
    --warn: #854F0B;
    --warn-light: #FAEEDA;
    --danger: #993C1D;
    --danger-light: #FAECE7;
    --gray: #5F5E5A;
    --gray-light: #F1EFE8;
    --text: #1a1a1a;
    --text-sub: #6b6b6b;
    --bg: #f8f8f6;
    --card: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 헤더 */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo { font-size: 17px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
  .logo span { color: var(--text); font-weight: 400; }

  /* 데이터 상태 바 */
  .status-bar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px;
  }
  .status-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .status-text { font-size: 12px; color: var(--text-sub); }
  .status-text strong { color: var(--text); }

  /* 메인 */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* 검색 박스 */
  .search-box {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 20px;
  }
  .search-box p {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 12px;
    line-height: 1.7;
  }
  .search-box p strong { color: var(--text); }
  .search-row {
    display: flex;
    gap: 8px;
  }
  #searchInput {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  #searchInput:focus { border-color: var(--primary); }
  #searchInput::placeholder { color: #aaa; }
  .btn-search {
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-search:hover { opacity: 0.88; }

  /* 결과 헤더 */
  .result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .result-count { font-size: 13px; color: var(--text-sub); }
  .result-count strong { color: var(--text); }

  /* 세무사 카드 */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .card.available { border-color: var(--primary-mid); border-width: 1.5px; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .avatar.avail { background: var(--primary-light); color: var(--primary); }
  .avatar.unavail { background: var(--gray-light); color: var(--gray); }

  .card-name { font-size: 16px; font-weight: 700; color: var(--text); }
  .card-firm { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .card-badges { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 4px; }

  .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
  .badge-status {
    font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 700;
  }
  .cap-text { font-size: 11px; color: var(--text-sub); }

  .card-info { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .card-info-row { display: flex; gap: 6px; font-size: 13px; color: var(--text-sub); }
  .card-info-row .icon { flex-shrink: 0; }

  .match-box {
    margin-top: 10px; font-size: 12px; padding: 7px 10px;
    background: var(--bg); border-radius: 6px; color: var(--text-sub); line-height: 1.6;
  }
  .match-box strong { color: var(--primary); }
  .note-box {
    margin-top: 8px; font-size: 12px; padding: 6px 10px;
    background: var(--warn-light); border-radius: 6px; color: var(--warn);
  }

  /* 빈 상태 */
  .empty-state {
    text-align: center; padding: 3rem 1rem;
    color: var(--text-sub); font-size: 15px;
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  /* 관리자 패널 */
  .admin-toggle {
    font-size: 12px; color: var(--text-sub);
    background: none; border: none; cursor: pointer; padding: 4px 8px;
    border-radius: 6px; transition: background 0.1s;
  }
  .admin-toggle:hover { background: var(--gray-light); }

  .admin-panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
    display: none;
  }
  .admin-panel.open { display: block; }
  .admin-panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .admin-panel p { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; line-height: 1.7; }

  .dropzone {
    border: 2px dashed var(--border-strong); border-radius: var(--radius-sm);
    padding: 24px; text-align: center; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: var(--primary-light); }
  .dropzone-icon { font-size: 28px; margin-bottom: 8px; }
  .dropzone-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .dropzone-sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

  .upload-status {
    display: none; margin-top: 10px; font-size: 13px;
    padding: 8px 12px; border-radius: var(--radius-sm);
  }

  /* 스피너 */
  .spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid var(--border-strong); border-top-color: var(--text-sub);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 5px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 모바일 */
  @media (max-width: 480px) {
    main { padding: 16px 14px 60px; }
    .search-box { padding: 16px; }
    .btn-search { padding: 12px 14px; font-size: 13px; }
    .card { padding: 14px; }
    .card-name { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">세무사<span> 매칭 검색</span></div>
    <button class="admin-toggle" onclick="toggleAdmin()">⚙️ 관리자</button>
  </div>
</header>

<div class="status-bar">
  <div class="status-inner">
    <span class="status-text" id="statusText"><span class="spinner"></span>데이터 불러오는 중...</span>
    <button class="admin-toggle" onclick="loadData()" style="font-size:11px">🔄 새로고침</button>
  </div>
</div>

<main>

  <!-- 관리자 패널 -->
  <div class="admin-panel" id="adminPanel">
    <h3>📂 데이터 업데이트</h3>
    <p>
      새 엑셀 파일을 업로드하면 모든 사용자에게 즉시 반영됩니다.<br>
      Google Sheets에서 <strong>파일 → 공유 → 웹에 게시 → CSV</strong>로 내보낸 파일을 사용하거나,<br>
      엑셀 파일(.xlsx)을 직접 업로드하세요.
    </p>
    <div class="dropzone" id="dropzone"
      onclick="document.getElementById('fileInput').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="event.preventDefault();this.classList.remove('drag');handleFile(event.dataTransfer.files[0])">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this.files[0])">
      <div class="dropzone-icon">📂</div>
      <div class="dropzone-label">파일을 드래그하거나 클릭하여 업로드</div>
      <div class="dropzone-sub">.xlsx / .xls / .csv 지원</div>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <!-- 검색 -->
  <div class="search-box">
    <p>
      <strong>입력 형식:</strong> 지역 / 업종 / 사업자유형<br>
      <strong>예시:</strong> 광주 / 도소매 / 법인 &nbsp;|&nbsp; 천안 / 건설업 / 개인 &nbsp;|&nbsp; 부산 / 제조, 수출입 / SR
    </p>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="예: 서울 / 도소매, 전자상거래 / 법인" />
      <button class="btn-search" onclick="doSearch()">검색</button>
    </div>
  </div>

  <div id="results"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxPoON_qWplhsQpChFTxqAOVA-EgqIP5qpJ3jq6Y3pB3-Nj70DLXJ7QUtm8OuDNOZoFha97URx-VK6/pub?gid=0&single=true&output=csv";
const LS_KEY  = "semusa_data_v1";
const LS_META = "semusa_meta_v1";

let TAX_DATA = [];
let adminOpen = false;

// ── 관리자 토글 ────────────────────────────────────────────
function toggleAdmin() {
  adminOpen = !adminOpen;
  document.getElementById("adminPanel").classList.toggle("open", adminOpen);
}

// ── 초기 로드: Google Sheets CSV 우선, 없으면 localStorage ─
async function loadData() {
  setStatus('<span class="spinner"></span>Google Sheets에서 데이터 불러오는 중...');
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const csv = await res.text();
    const rows = Papa.parse(csv, { header: true, skipEmptyLines: true }).data;
    const parsed = rows.map(parseRow).filter(t => t.name);
    if (!parsed.length) throw new Error("데이터 없음");
    TAX_DATA = parsed;
    const meta = { updatedAt: new Date().toISOString(), count: parsed.length, source: "Google Sheets" };
    localStorage.setItem(LS_KEY, JSON.stringify(parsed));
    localStorage.setItem(LS_META, JSON.stringify(meta));
    showStatus(meta);
  } catch(e) {
    // Google Sheets 실패 → localStorage 폴백
    const cached = localStorage.getItem(LS_KEY);
    const meta   = JSON.parse(localStorage.getItem(LS_META) || "null");
    if (cached && meta) {
      TAX_DATA = JSON.parse(cached);
      showStatus(meta, true);
    } else {
      setStatus('⚠️ <span style="color:var(--danger)">데이터를 불러올 수 없습니다. 관리자가 파일을 업로드해주세요.</span>');
    }
  }
}

function showStatus(meta, cached = false) {
  const dt = new Date(meta.updatedAt);
  const dtStr = `${dt.getFullYear()}.${pad(dt.getMonth()+1)}.${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  const src = cached ? "캐시" : meta.source;
  setStatus(`✅ <strong>${meta.count}명</strong> &nbsp;·&nbsp; 최종 업데이트: <strong>${dtStr}</strong> &nbsp;·&nbsp; <span style="color:var(--text-sub)">${src}</span>`);
}

function setStatus(html) {
  document.getElementById("statusText").innerHTML = html;
}

function pad(n) { return String(n).padStart(2, "0"); }

// ── 엑셀/CSV 수동 업로드 ───────────────────────────────────
function handleFile(file) {
  if (!file) return;
  const us = document.getElementById("uploadStatus");
  us.style.display = "block";
  us.style.background = "#f5f5f3"; us.style.color = "#6b6b6b";
  us.innerHTML = '<span class="spinner"></span>파일 읽는 중...';

  const reader = new FileReader();

  if (file.name.endsWith(".csv")) {
    reader.onload = e => {
      const rows = Papa.parse(e.target.result, { header: true, skipEmptyLines: true }).data;
      finishUpload(rows, file.name, us);
    };
    reader.readAsText(file, "UTF-8");
  } else {
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
        finishUpload(rows, file.name, us);
      } catch(err) {
        us.style.background = "#FAECE7"; us.style.color = "#993C1D";
        us.innerHTML = "❌ 파일 오류: " + err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  }
}

function finishUpload(rows, filename, us) {
  const parsed = rows.map(parseRow).filter(t => t.name);
  if (!parsed.length) {
    us.style.background = "#FAECE7"; us.style.color = "#993C1D";
    us.innerHTML = "❌ 데이터를 찾을 수 없습니다. 컬럼명을 확인해주세요.";
    return;
  }
  TAX_DATA = parsed;
  const meta = { updatedAt: new Date().toISOString(), count: parsed.length, source: filename };
  localStorage.setItem(LS_KEY, JSON.stringify(parsed));
  localStorage.setItem(LS_META, JSON.stringify(meta));
  showStatus(meta);
  const dt = new Date();
  us.style.background = "#E1F5EE"; us.style.color = "#0F6E56";
  us.innerHTML = `✅ ${parsed.length}명 업로드 완료 · ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

// ── 데이터 파싱 ────────────────────────────────────────────
function parseRow(r) {
  const srRaw = r["SR수임"] || "";
  const sr = srRaw === true || srRaw === 1
          || String(srRaw).toLowerCase() === "checked"
          || srRaw === "예" || srRaw === "✓" || srRaw === "TRUE";
  const avRaw = String(r["배정가능여부"] || "");
  const available = avRaw.includes("가능") && !avRaw.includes("불") ? "가능"
                  : avRaw.includes("불") ? "불가능" : "unknown";
  const ind = r["개인 수임"];
  const corp = r["법인 수임"];
  return {
    name:          String(r["★이름"] || "").trim(),
    firm:          String(r["★상호"] || r["지점명(slack)"] || "").trim(),
    address:       String(r["사업장 주소"] || r["◆사업장 주소"] || "").trim(),
    phone:         String(r["★연락처"] || "").trim(),
    available,
    sr,
    individual:    ind !== "" && ind !== undefined ? Number(ind) : null,
    corporate:     corp !== "" && corp !== undefined ? Number(corp) : null,
    industries_ok: String(r["가능 업종"] || "").trim(),
    industries_no: String(r["불가능 업종"] || "").trim(),
    specialty:     String(r["◆전문 업종"] || "").trim(),
    notes:         String(r["배정 특이사항"] || r["지점 특이사항"] || "").trim(),
    lat:           parseFloat(r["위도"] || r["lat"] || "") || null,
    lng:           parseFloat(r["경도"] || r["lng"] || "") || null,
  };
}

// ── 지역/검색 유틸 ─────────────────────────────────────────
const SEARCH_COORDS = {
  "서울":[37.5665,126.9780],"경기":[37.4138,127.5183],"인천":[37.4563,126.7052],
  "부산":[35.1796,129.0756],"대구":[35.8714,128.6014],"울산":[35.5384,129.3114],
  "대전":[36.3504,127.3845],"광주":[35.1595,126.8526],
  "충청":[36.6588,127.2000],"전라":[35.7175,127.1530],"경상":[35.6000,128.2000],
  "강원":[37.8813,127.7300],"제주":[33.4890,126.4983],
  "천안":[36.8065,127.1523],"수원":[37.2636,127.0286],"성남":[37.4449,127.1388],
  "고양":[37.6584,126.8320],"남양주":[37.6359,127.2165],"용인":[37.2411,127.1776],
  "안산":[37.3219,126.8309],"안양":[37.3943,126.9568],"평택":[36.9921,127.1127],
  "파주":[37.7601,126.7799],"광명":[37.4789,126.8647],"김포":[37.6150,126.7160],
  "청주":[36.6424,127.4890],"전주":[35.8242,127.1480],"창원":[35.2280,128.6811],
  "포항":[36.0190,129.3435],"춘천":[37.8813,127.7300],"원주":[37.3422,127.9202],
  "강릉":[37.7519,128.8761],"목포":[34.8118,126.3922],"순천":[34.9506,127.4877],
  "여수":[34.7604,127.6622],
};
const REGION_ALIASES = {
  "서울":["서울","서울시","서울특별시"],"경기":["경기","경기도"],
  "인천":["인천","인천광역시"],"부산":["부산","부산광역시"],
  "대구":["대구","대구광역시"],"울산":["울산","울산광역시"],
  "대전":["대전","대전광역시"],"광주":["광주","광주광역시"],
  "충청":["충청","충남","충북","충청남도","충청북도"],
  "전라":["전라","전남","전북","전라남도","전라북도"],
  "경상":["경상","경남","경북","경상남도","경상북도"],
  "강원":["강원","강원도"],"제주":["제주","제주도"],
};
const CITY_KEYS = Object.keys(SEARCH_COORDS).filter(k => !Object.keys(REGION_ALIASES).includes(k));

function resolveRegion(s) {
  const t = s.trim();
  for (const [key, aliases] of Object.entries(REGION_ALIASES)) {
    if (aliases.some(a => t === a || t.startsWith(a))) return key;
  }
  for (const city of CITY_KEYS) { if (t.includes(city)) return city; }
  return t || null;
}
function coordFromAddress(addr) {
  if (!addr) return null;
  for (const [city, coord] of Object.entries(SEARCH_COORDS)) {
    if (addr.includes(city)) return coord;
  }
  return null;
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function normalizeBiz(s) {
  const l = s.toLowerCase();
  if (l.includes("sr")||l.includes("에스알")) return "SR";
  if (l.includes("법인")) return "법인";
  if (l.includes("개인")) return "개인";
  return "전체";
}
function bizMatch(t, b) {
  if (b==="전체") return true;
  if (b==="SR") return t.sr===true;
  if (b==="개인") return t.individual!==null && t.individual>=0;
  if (b==="법인") return t.corporate!==null && t.corporate>=0;
  return true;
}
function industryCheck(t, industries) {
  if (!industries.length) return { pass:true, matchCount:0 };
  let matchCount = 0;
  const ok = (t.industries_ok+" "+t.specialty).toLowerCase();
  const no = (t.industries_no||"").toLowerCase();
  for (const ind of industries) {
    const kw = ind.toLowerCase();
    if (no.includes(kw)) return { pass:false, matchCount:0 };
    if (!ok.trim()||ok.includes(kw)) matchCount++;
  }
  return { pass:true, matchCount };
}
function capInfo(t, b) {
  if (b==="SR"||b==="개인") return t.individual!==null ? `개인 잔여 ${t.individual}건` : null;
  if (b==="법인") return t.corporate!==null ? `법인 잔여 ${t.corporate}건` : null;
  const p=[];
  if (t.individual!==null) p.push(`개인 ${t.individual}건`);
  if (t.corporate!==null) p.push(`법인 ${t.corporate}건`);
  return p.length ? "잔여: "+p.join(" / ") : null;
}

// ── 검색 ───────────────────────────────────────────────────
function doSearch() {
  if (!TAX_DATA.length) {
    document.getElementById("results").innerHTML = `<div class="empty-state">데이터가 없습니다. 잠시 후 새로고침해주세요.</div>`;
    return;
  }
  const raw = document.getElementById("searchInput").value.trim();
  if (!raw) return;

  const parts = raw.split("/").map(s => s.trim());
  const region = resolveRegion(parts[0]||"");
  const industries = (parts[1]||"").split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  const biz = normalizeBiz(parts[2]||"");
  const searchCoord = region ? (SEARCH_COORDS[region]||null) : null;

  const candidates = TAX_DATA.map(t => {
    if (!bizMatch(t, biz)) return null;
    const ic = industryCheck(t, industries);
    if (!ic.pass) return null;
    let tLat=t.lat, tLng=t.lng;
    if (!tLat||!tLng) { const e=coordFromAddress(t.address); if(e){tLat=e[0];tLng=e[1];} }
    const distKm = !searchCoord ? 0 : (tLat&&tLng ? haversine(searchCoord[0],searchCoord[1],tLat,tLng) : 9999);
    return {...t, matchCount:ic.matchCount, distKm};
  }).filter(Boolean);

  candidates.sort((a,b) => {
    const aA=a.available==="가능"?2:a.available==="unknown"?1:0;
    const bA=b.available==="가능"?2:b.available==="unknown"?1:0;
    if (bA!==aA) return bA-aA;
    if (b.matchCount!==a.matchCount) return b.matchCount-a.matchCount;
    return a.distKm-b.distKm;
  });

  renderResults(candidates, { region, industries, biz, searchCoord });
}

// ── 렌더링 ─────────────────────────────────────────────────
function renderResults(list, q) {
  const el = document.getElementById("results");
  let tags = "";
  if (q.region) tags += `<span class="tag" style="background:#E6F1FB;color:#185FA5">📍 ${q.region}</span>`;
  if (q.industries.length) tags += `<span class="tag" style="background:#E1F5EE;color:#0F6E56">🏭 ${q.industries.join(", ")}</span>`;
  if (q.biz!=="전체") tags += `<span class="tag" style="background:#EEEDFE;color:#3C3489">🏢 ${q.biz}</span>`;

  if (!list.length) {
    el.innerHTML = `<div style="margin-bottom:12px" class="result-header">${tags}</div><div class="empty-state">조건에 맞는 세무사가 없습니다.<br><span style="font-size:13px;margin-top:6px;display:block">업종명이나 지역을 다르게 입력해보세요.</span></div>`;
    return;
  }

  let html = `<div class="result-header">${tags}<span class="result-count">— <strong>${list.length}명</strong> 매칭</span></div>`;

  list.forEach(t => {
    const avail=t.available==="가능", unk=t.available==="unknown";
    const sBg=avail?"#E1F5EE":unk?"#F1EFE8":"#FAECE7";
    const sCol=avail?"#0F6E56":unk?"#5F5E5A":"#993C1D";
    const sLbl=avail?"수임 가능":unk?"확인 필요":"수임 불가";
    const cap=capInfo(t,q.biz);

    let distBadge="";
    if (q.searchCoord && t.distKm<9999) {
      const km=Math.round(t.distKm);
      const dBg=km<50?"#E1F5EE":km<150?"#E6F1FB":km<300?"#FAEEDA":"#FAECE7";
      const dCol=km<50?"#0F6E56":km<150?"#185FA5":km<300?"#854F0B":"#993C1D";
      distBadge=`<span class="tag" style="background:${dBg};color:${dCol};font-size:11px">📏 ${km}km</span>`;
    }

    html += `<div class="card${avail?" available":""}">`;
    html += `<div class="card-top">`;
    html += `<div class="card-left">`;
    html += `<div class="avatar ${avail?"avail":"unavail"}">${t.name.charAt(0)}</div>`;
    html += `<div>`;
    html += `<div class="card-name">${t.name} 세무사</div>`;
    html += `<div class="card-firm">${t.firm}</div>`;
    html += `<div class="card-badges">`;
    if (t.sr) html += `<span class="tag" style="background:#E6F1FB;color:#185FA5;font-size:11px">SR</span>`;
    html += distBadge;
    html += `</div></div></div>`;
    html += `<div class="card-right">`;
    html += `<span class="badge-status" style="background:${sBg};color:${sCol}">${sLbl}</span>`;
    if (cap) html += `<span class="cap-text">${cap}</span>`;
    html += `</div></div>`;

    html += `<div class="card-info">`;
    if (t.address) html += `<div class="card-info-row"><span class="icon">📍</span><span>${t.address}</span></div>`;
    if (t.phone&&t.phone!=="-") html += `<div class="card-info-row"><span class="icon">📞</span><span>${t.phone.split("\n")[0]}</span></div>`;
    html += `</div>`;

    if (q.industries.length&&t.matchCount>0&&t.industries_ok) {
      const preview=t.industries_ok.slice(0,120)+(t.industries_ok.length>120?"…":"");
      html += `<div class="match-box"><strong>✓ 업종 매칭 (${t.matchCount}/${q.industries.length})</strong> — ${preview}</div>`;
    }
    if (t.notes) html += `<div class="note-box">⚠️ ${t.notes.trim()}</div>`;
    html += `</div>`;
  });

  el.innerHTML = html;
}

document.getElementById("searchInput").addEventListener("keydown", e => { if(e.key==="Enter") doSearch(); });
loadData();
</script>
